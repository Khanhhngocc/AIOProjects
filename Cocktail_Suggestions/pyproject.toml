[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cocktail-suggestions"
version = "0.1.0"
description = "Cocktail recommendation system using semantic search"
requires-python = ">=3.10"

dependencies = [
    "pandas",
    "psycopg[binary]",
    "pgvector",
    "sentence-transformers",
    "python-dotenv",
    "streamlit"
]

[tool.setuptools.packages.find]
where = ["src"]