[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vic-ltsf-forecasting"
version = "0.1.0"
description = "VIC stock forecasting using Linear, NLinear, and DLinear models"
requires-python = ">=3.10"

dependencies = [
    "gdown",
    "joblib",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]