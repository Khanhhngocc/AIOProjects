[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-checkin"
version = "0.2.0"
description = "Face-based employee check-in system using FAISS and InsightFace"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "Pillow",
    "faiss-cpu>=1.10,<2",
    "insightface==2.1",
    "onnxruntime>=1.26,<2",
    "streamlit",
    "opencv-python",
    "pandas",
    "plotly",
    "scikit-learn",
    "matplotlib"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]